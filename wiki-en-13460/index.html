<!doctype html>
<html lang="en" class="static">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 44 44%27%3E%3Crect width=%2744%27 height=%2744%27 rx=%2710%27 fill=%27%23FAF9F7%27/%3E%3Crect x=%278%27 y=%2711%27 width=%2728%27 height=%275%27 rx=%272.5%27 fill=%27%236B5CE7%27/%3E%3Crect x=%278%27 y=%2720%27 width=%2719%27 height=%275%27 rx=%272.5%27 fill=%27%236B5CE7%27 opacity=%270.4%27/%3E%3Crect x=%278%27 y=%2729%27 width=%2710%27 height=%275%27 rx=%272.5%27 fill=%27%23E08A3C%27/%3E%3C/svg%3E">
<title>Hypertext</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css"><style>/* PaperFold: one paper, five zoom levels.
   Serif = the author's words (Full, Key). Sans = written summaries (Brief, Takeaway, Topic).
   Ink: at every level, the words that survive the next zoom-out are darker. */
:root {
  --surface: #FAF9F7;
  --card: #FFFFFF;
  --ink: #1A1A1A;
  --ink-2: #4A4540;
  --muted: #6B6560;
  --faint: #BAB3AA;
  --line: #DCD8D1;
  --line-2: #E9E5DF;
  --accent: #6B5CE7;
  --accent-soft: #EDE9FF;
  --accent-deep: #362680;
  --warm: #E08A3C;   /* ThoughtDAG's branch orange: the mark's third stroke */
  --rule: #8A847C;
  --serif: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Songti SC', serif;
  --sans: 'Inter', 'Inter Variable', -apple-system, 'PingFang SC', 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-context: #A39C93; --r-gap: #D9822B; --r-claim: #6B5CE7; --r-method: #3B82C4;
  --r-setup: #7C8BA1; --r-result: #2E9E6A; --r-analysis: #0F8B8D; --r-limitation: #C2453D;
  --rel-supports: #2E9E6A; --rel-builds_on: #3B82C4; --rel-qualifies: #C2453D; --rel-explains: #6B5CE7; --rel-ref: #A39C93;
  --hl: #FFE07A; --hl-ink: #D9A400;   /* the reader's highlights */
  --col: 700px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #1B1915; --card: #24211C; --ink: #EDE9E3; --ink-2: #C9C3BA; --muted: #9C958B;
    --faint: #5E5850; --line: #3A362F; --line-2: #2E2B25; --accent: #A79FF4; --accent-soft: #2D2850;
    --accent-deep: #CFC9FA; --rule: #8A847C; --hl: #8A7024; --hl-ink: #E8C04A;
  }
  :root:not([data-theme="light"]) .fbody img { background: #fff; border-radius: 4px; }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { overflow-anchor: none; }
body {
  margin: 0; background: var(--surface); color: var(--ink);
  font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── chrome ─────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 14px 24px; background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; min-width: 0; }
.brand svg { width: 18px; height: 18px; flex: none; }
/* the mark: ThoughtDAG's three colours in its order (solid violet, faded violet, branch orange) */
svg .m1 { fill: var(--accent); } svg .m2 { fill: var(--accent); opacity: .4; } svg .m3 { fill: var(--warm); }
.brand a { font-weight: 450; color: var(--muted); font-size: 13.5px; margin-left: 6px; white-space: nowrap; }
.brand a.brand-home { display: flex; align-items: center; gap: 9px; font: inherit; color: var(--ink); margin: 0; text-decoration: none; }
.tagline { color: var(--muted); font-size: 13.5px; white-space: nowrap; }
.topbar { gap: 14px; }
.brand { flex: 1; }
.langbtn { font: 600 12.5px var(--sans); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px;
  padding: 5px 11px; cursor: pointer; order: 3; }
.langbtn:hover { filter: brightness(.97); }
.backpill { pointer-events: auto; font: 600 13px var(--sans); color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 13px; cursor: pointer; box-shadow: 0 6px 20px -12px rgba(40, 30, 10, .3); }
.backpill:hover { border-color: var(--accent); color: var(--accent); }

footer.zoom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
  gap: 6px; padding: 10px 16px 14px; pointer-events: none;
  background: linear-gradient(to top, var(--surface) 55%, color-mix(in srgb, var(--surface) 0%, transparent));
}
/* the zoom bar: a segmented control. A recessed track, a raised white thumb that the zoom position (and the
   finger) moves frame by frame, so it carries no transition of its own; pressing it sinks it slightly. */
.zoombar {
  pointer-events: auto; position: relative; display: flex; align-items: center; gap: 0; padding: 3px; border-radius: 999px;
  background: color-mix(in srgb, var(--line-2) 75%, var(--surface)); border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
  box-shadow: inset 0 1px 2px rgba(40, 30, 10, .07), 0 10px 30px -16px rgba(40, 30, 10, .35);
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab;
}
.zoombar.dragging, .zoombar.dragging button { cursor: grabbing; }
.zoombar button {
  position: relative; z-index: 1; font: inherit; font-size: 14px; font-weight: 500; color: var(--muted); background: none; border: 0;
  cursor: inherit; padding: 6px 15px; border-radius: 999px; transition: color .2s;
}
.zoombar button:hover { color: var(--ink-2); }
.zoombar button.on { color: var(--ink); font-weight: 600; }
.zthumb {
  position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; width: 0; border-radius: 999px; background: var(--card); pointer-events: none;
  box-shadow: 0 0 0 .5px rgba(30, 20, 0, .08), 0 1px 1.5px rgba(30, 20, 0, .14), 0 3px 9px rgba(30, 20, 0, .10);
  transition: scale .2s cubic-bezier(.3, 1.4, .5, 1), box-shadow .2s; will-change: transform, width;
}
.zoombar.dragging .zthumb { scale: .955; box-shadow: 0 0 0 .5px rgba(30, 20, 0, .1), 0 2px 4px rgba(30, 20, 0, .16), 0 6px 16px rgba(30, 20, 0, .14); }
.zoombar .sep { position: relative; z-index: 1; color: var(--faint); font-size: 11px; opacity: .6; user-select: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .zthumb { background: #3A362F; } }
.hint { color: var(--muted); font-size: 12.5px; }
.legend { display: none; flex-wrap: wrap; justify-content: flex-end; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
html[data-level="0"] .legend, html[data-level="1"] .legend, html[data-level="2"] .legend { display: flex; }
html[data-level="0"] .tagline, html[data-level="1"] .tagline, html[data-level="2"] .tagline { display: none; }
.legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.legend > span { cursor: pointer; border-radius: 999px; padding: 1px 6px; margin: -1px -6px; transition: background-color .15s, color .15s; }
.legend > span:hover, .legend > span.on { color: var(--ink); background: color-mix(in srgb, var(--line-2) 70%, transparent); }
.legend > span.pin { color: var(--ink); background: var(--line-2); box-shadow: inset 0 0 0 1px var(--line); }
.legend > span:hover i, .legend > span.on i, .legend > span.pin i { animation: dr-beat 1.6s ease-out infinite; }
/* a kind lit from the legend: its dots beat (ThoughtDAG's breathing dots: a ring of their colour spreads and fades),
   the other dots step back; on the map its chips are outlined. A zoom stops the beat (html.morphing). */
@keyframes dr-beat {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--beat) 60%, transparent); }
  70% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--beat) 0%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--beat) 0%, transparent); }
}
.doc[data-role] .dot { transition: opacity .15s; }
.doc[data-role] .u:not([data-l="4"]):not([data-l="3"]) .dot { opacity: .22; }
.doc[data-role] .u[data-l="0"] { opacity: .35; transition: opacity .15s, border-color .15s; }
html.morphing .dot, html.morphing .legend i { animation: none !important; }
.doc[data-role="context"] .u.r-context .dot { --beat: var(--r-context); opacity: 1 !important; animation: dr-beat 1.6s ease-out infinite; }
.doc[data-role="context"] .u.r-context[data-l="0"] { opacity: 1; border-color: var(--r-context); }
.doc[data-role="gap"] .u.r-gap .dot { --beat: var(--r-gap); opacity: 1 !important; animation: dr-beat 1.6s ease-out infinite; }
.doc[data-role="gap"] .u.r-gap[data-l="0"] { opacity: 1; border-color: var(--r-gap); }
.doc[data-role="claim"] .u.r-claim .dot { --beat: var(--r-claim); opacity: 1 !important; animation: dr-beat 1.6s ease-out infinite; }
.doc[data-role="claim"] .u.r-claim[data-l="0"] { opacity: 1; border-color: var(--r-claim); }
.doc[data-role="method"] .u.r-method .dot { --beat: var(--r-method); opacity: 1 !important; animation: dr-beat 1.6s ease-out infinite; }
.doc[data-role="method"] .u.r-method[data-l="0"] { opacity: 1; border-color: var(--r-method); }
.doc[data-role="setup"] .u.r-setup .dot { --beat: var(--r-setup); opacity: 1 !important; animation: dr-beat 1.6s ease-out infinite; }
.doc[data-role="setup"] .u.r-setup[data-l="0"] { opacity: 1; border-color: var(--r-setup); }
.doc[data-role="result"] .u.r-result .dot { --beat: var(--r-result); opacity: 1 !important; animation: dr-beat 1.6s ease-out infinite; }
.doc[data-role="result"] .u.r-result[data-l="0"] { opacity: 1; border-color: var(--r-result); }
.doc[data-role="analysis"] .u.r-analysis .dot { --beat: var(--r-analysis); opacity: 1 !important; animation: dr-beat 1.6s ease-out infinite; }
.doc[data-role="analysis"] .u.r-analysis[data-l="0"] { opacity: 1; border-color: var(--r-analysis); }
.doc[data-role="limitation"] .u.r-limitation .dot { --beat: var(--r-limitation); opacity: 1 !important; animation: dr-beat 1.6s ease-out infinite; }
.doc[data-role="limitation"] .u.r-limitation[data-l="0"] { opacity: 1; border-color: var(--r-limitation); }


#ghosts { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
/* the stage: the paper on screen kept at each level (keyframes), played while a zoom is under way (reader.js) */
.zhost { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
.zstage { position: fixed; inset: 0; z-index: 10; overflow: hidden; contain: strict; pointer-events: none; opacity: 0; }
.zstage.on { opacity: 1; pointer-events: auto; background: var(--surface); }
.zl { position: absolute; inset: 0; opacity: 0; content-visibility: hidden; }
.zl.live { content-visibility: visible; }
/* a group of copies that move alike (reader.js, pairs): placed by its members, moved and faded as one */
.zg { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transform-origin: 0 0; pointer-events: none; }
/* while a zoom plays, each group (and each lone copy) of the pair in play is its own compositor layer: drawn once, then
   only moved and faded by the GPU. Repainting them every frame dropped one frame in five at 2x on a real GPU. */
.zstage.on .zl.live > .zg, .zstage.on .zl.live > .zp { will-change: transform, opacity; }
.zp { position: absolute !important; left: 0 !important; top: 0 !important; margin: 0 !important; transform-origin: 0 0; transition: none !important; animation: none !important; pointer-events: none; }
.zp.zi { white-space: nowrap; }
.zp.zb { white-space: normal; overflow: hidden; }
.zp img { max-width: 100%; height: auto; display: inline-block; }
/* the sandbox a keyframe is laid out in: in the flow of nothing, never painted */
.zsand { position: fixed; top: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none; contain: layout style paint; }
#ghosts > * { position: fixed; margin: 0; white-space: nowrap; transform-origin: 0 0; }

/* ── document column ────────────────────────────────────── */
.doc { position: relative; max-width: var(--col); margin: 0 auto; padding: 8px 24px 160px; }
/* a wide screen: a wider column, with the margins still wide enough for the notes beside it (34px + 236px) */
@media (min-width: 1480px) { :root { --col: 780px; } }
@media (min-width: 1760px) { :root { --col: 860px; } }
.doc[data-level="0"] { max-width: 1280px; }
.tk { display: inline-block; transform-origin: 0 0; white-space: pre-wrap; }
.tk.at { white-space: nowrap; }
.tk.at.wrap { white-space: normal; max-width: 100%; }
.wg { white-space: nowrap; }
[data-id] { transform-origin: 0 0; }

.paper-head { margin: 28px 0 34px; }
.paper-head h1 { font-family: var(--sans); font-size: 34px; line-height: 1.15; letter-spacing: -.025em; font-weight: 700; margin: 0 0 12px; text-wrap: balance; }
.paper-head .authors { color: var(--muted); font-size: 15px; }
.paper-head .orig { color: var(--muted); font-size: 15px; font-style: italic; margin: -4px 0 8px; font-family: var(--serif); }
.doc[data-level="0"] .paper-head { margin: 8px 0 18px; }
.doc[data-level="0"] .paper-head h1 { font-size: 22px; }
.doc[data-level="1"] .paper-head h1, .doc[data-level="2"] .paper-head h1 { font-size: 28px; }

.chunk { position: relative; transition: background-color .35s, border-color .35s, box-shadow .35s, padding .35s; border: 1px solid transparent; border-radius: 12px; }
.hd { font-family: var(--sans); color: var(--ink); letter-spacing: -.015em; margin: 0; }
.hd .num { color: var(--muted); font-weight: 500; margin-right: .45em; }
.chunk.l2 > .hd { font-size: 24px; font-weight: 700; margin: 46px 0 14px; }
.chunk.l3 > .hd { font-size: 19px; font-weight: 650; margin: 34px 0 10px; }
.chunk.l4 > .hd, .chunk.l5 > .hd { font-size: 16.5px; font-weight: 650; margin: 26px 0 8px; }
.stake { display: none; font-family: var(--sans); color: var(--muted); font-size: 15px; line-height: 1.45; margin: -4px 0 14px; }
.doc[data-level="2"] .stake, .doc[data-level="1"] .stake, .doc[data-level="0"] .stake { display: block; }

/* ── units ──────────────────────────────────────────────── */
.u { position: relative; transition: background-color .35s, border-color .35s, color .35s; border: 1px solid transparent; }
.u .tx { margin: 0; }
.dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--beat); opacity: 0; transition: opacity .3s; --beat: var(--r-context); }
.u.r-gap .dot { --beat: var(--r-gap); } .u.r-claim .dot { --beat: var(--r-claim); }
.u.r-method .dot { --beat: var(--r-method); } .u.r-setup .dot { --beat: var(--r-setup); }
.u.r-result .dot { --beat: var(--r-result); } .u.r-analysis .dot { --beat: var(--r-analysis); }
.u.r-limitation .dot { --beat: var(--r-limitation); }
/* the paragraph under the pointer: its dot beats, and so does its kind in the legend (at Key, Takeaway and Topic,
   where the dots show) */
.doc:not([data-role]) .u[data-l="2"]:hover > .dot, .doc:not([data-role]) .u[data-l="1"]:hover > .dot,
.doc:not([data-role]) .u[data-l="0"]:hover > .dot { animation: dr-beat 1.6s ease-out infinite; }

/* L4 Full and L3 Key: the author's words */
.u[data-l="4"], .u[data-l="3"] { font-family: var(--serif); font-size: 18.5px; line-height: 1.62; color: var(--ink-2); margin: 0 0 14px; }
.u[data-l="4"] .tk.lead, .u[data-l="3"] .tk.lead, .u[data-l="4"] .tr.lead, .u[data-l="3"] .tr.lead { color: var(--ink); }
.u[data-l="3"] .tk:not(.lead), .u[data-l="3"] .tr:not(.lead) { color: var(--muted); }
.tk.gap, .tr.gap { color: var(--faint) !important; padding: 0 .1em; }
.u.abstract[data-l="4"], .u.abstract[data-l="3"] { font-size: 17.5px; }
.u.local-open { background: var(--card); border-color: var(--line); border-radius: 10px; padding: 10px 14px; margin-left: -15px; margin-right: -15px; box-shadow: 0 8px 28px -18px rgba(40, 30, 10, .35); }

/* L2 Brief: takeaway + reason, written */
.u[data-l="2"] { font-family: var(--sans); font-size: 16.5px; line-height: 1.55; color: var(--muted); margin: 0 0 12px; padding-left: 18px; }
.u[data-l="2"] .tk.lead, .u[data-l="2"] .tr.lead { color: var(--ink); font-weight: 560; }
.u[data-l="2"] .dot { left: 0; top: .62em; opacity: 1; }

/* L1 Takeaway: one line per unit on a spine */
.u[data-l="1"] { font-family: var(--sans); font-size: 15.5px; line-height: 1.45; color: var(--ink-2); padding: 3px 0 3px 22px; margin: 0; }
.u[data-l="1"] .tk.lead, .u[data-l="1"] .tr.lead { color: var(--ink); font-weight: 600; }
.u[data-l="1"] .dot { left: 0; top: .72em; opacity: 1; box-shadow: 0 0 0 3px var(--surface); }
.doc[data-level="1"] .chunk .body { position: relative; }
.doc[data-level="1"] .chunk .body::before { content: ""; position: absolute; left: 3px; top: 10px; bottom: 10px; width: 1px; background: var(--line); }

/* L0 Topic: chips on a map of cards */
.u[data-l="0"] { display: inline-flex; align-items: center; gap: 5px; font-family: var(--sans); font-size: 12px; font-weight: 550; line-height: 1.2;
  color: var(--ink); background: var(--surface); border-color: var(--line-2); border-radius: 999px; padding: 2px 8px 2px 7px; margin: 0 4px 4px 0; cursor: pointer; }
.u[data-l="0"]:hover { border-color: var(--accent); }
.u[data-l="0"] .dot { position: static; flex: none; opacity: 1; }
.u[data-l="0"] .tx { display: inline; }

.doc[data-level="0"] .chunks { display: grid; grid-template-columns: repeat(auto-fill, minmax(226px, 1fr)); gap: 10px; align-items: start; }
.doc[data-level="0"] .chunk { background: var(--card); border-color: var(--line); padding: 10px 10px 6px; box-shadow: 0 4px 18px -14px rgba(40, 30, 10, .3); }
.doc[data-level="0"] .chunk > .hd { font-size: 13.5px; font-weight: 650; margin: 0 0 4px; }
.doc[data-level="0"] .chunk .stake { font-size: 12px; line-height: 1.35; margin: 0 0 8px; }
.doc[data-level="0"] .chunk.empty { grid-column: 1 / -1; background: none; border-color: transparent; box-shadow: none; padding: 10px 2px 0; }
.doc[data-level="0"] .chunk.empty > .hd { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.doc[data-level="0"] .chunk ul.list { display: contents; }
.doc[data-level="0"] .chunk li.u { list-style: none; }
.doc[data-level="0"] .chunk .body { display: flex; flex-wrap: wrap; align-items: center; }

/* lists */
ul.list { list-style: none; padding: 0; margin: 0 0 14px; }
li.u .mk { position: absolute; left: -1.2em; color: var(--muted); font-family: var(--sans); font-size: .9em; }
li.u[data-l="4"], li.u[data-l="3"] { margin: 0 0 6px 1.3em; }
li.u[data-l="2"] { padding-left: 34px; }
li.u[data-l="2"] .dot { left: 14px; }
li.u[data-l="1"] { padding-left: 38px; }
li.u[data-l="2"] .mk, li.u[data-l="1"] .mk, li.u[data-l="0"] .mk { display: none; }

/* ── figures, tables, equations ─────────────────────────── */
figure.fig { margin: 26px 0; }
figure.fig .fbody { text-align: center; overflow-x: auto; transition: opacity .3s; }
figure.fig .fbody img { max-width: 100%; height: auto; display: inline-block; }
figure.fig .fbody img, figure.fig .fbody svg { cursor: zoom-in; }
/* a figure, enlarged over the page: dark around it in either theme, the picture on white as on paper */
.lightbox { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  padding: 28px 24px 22px; background: rgba(20, 18, 15, .88); animation: lb-in .16s ease-out; }
@keyframes lb-in { from { opacity: 0; } }
.lightbox .lb-stage { min-height: 0; max-width: 100%; display: flex; align-items: center; justify-content: center; }
.lightbox .lb-pic { display: block; max-width: min(94vw, 1600px); max-height: 80vh; width: auto; height: auto; background: #fff; border-radius: 6px;
  padding: 8px; box-shadow: 0 24px 70px -20px rgba(0, 0, 0, .7); cursor: zoom-in; }
.lightbox:has(.lb-cap) .lb-pic { max-height: 74vh; }
.lightbox svg.lb-pic { width: min(94vw, 1200px); height: 76vh; }
.lightbox.lb-full .lb-stage { overflow: auto; align-self: stretch; justify-content: flex-start; align-items: flex-start; flex: 1; }
.lightbox.lb-full .lb-pic { max-width: none; max-height: none; margin: auto; cursor: zoom-out; }
.lightbox .lb-cap { max-width: min(760px, 92vw); max-height: 16vh; overflow-y: auto; color: #EDE9E3; font: 14px/1.5 var(--sans); text-align: center; }
.lightbox .lb-x { position: absolute; top: 12px; right: 14px; width: 38px; height: 38px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .12);
  color: #fff; font: 400 24px/1 var(--sans); cursor: pointer; }
.lightbox .lb-x:hover, .lightbox .lb-x:focus-visible { background: rgba(255, 255, 255, .24); outline: none; }
html.lb-open { overflow: hidden; }
@media (prefers-reduced-motion: reduce) { .lightbox { animation: none; } }
figure.fig figcaption.u { font-family: var(--sans); }

}

html[lang^="ja"] .u[data-l="4"], html[lang^="ja"] .u[data-l="3"], html[lang^="ko"] .u[data-l="4"], html[lang^="ko"] .u[data-l="3"],

/* ── the reader's notes (docs/notes-format.md) ──────────────── */
.tk.hl, .tr.hl, .hlsp { background-color: color-mix(in srgb, var(--hl) 78%, transparent); border-radius: 2px; cursor: pointer; }
.tk.hls, .tr.hls, .hlsp.hls { background-color: color-mix(in srgb, var(--hl) 36%, transparent); }
/* a paragraph with notes keeps a mark at every level, also where the passage itself is not shown */
.u.has-notes::after { content: ""; position: absolute; left: -13px; top: .4em; bottom: .4em; width: 3px; border-radius: 2px; background: var(--hl-ink); opacity: .75; }
li.u.has-notes::after { left: calc(-1.3em - 13px); }
.u[data-l="2"].has-notes::after, .u[data-l="1"].has-notes::after { left: -10px; }
.u[data-l="0"].has-notes::after { position: static; flex: none; width: 6px; height: 6px; border-radius: 50%; opacity: 1; }
.side-notes { display: flex; flex-direction: column; gap: 5px; margin-bottom: 4px; }
.side-notes:empty { display: none; }
.ncard { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; font: 450 12.5px/1.45 var(--sans); color: var(--ink-2);
  background: color-mix(in srgb, var(--hl) 20%, var(--card)); border: 0; border-left: 2px solid var(--hl-ink); border-radius: 0 7px 7px 0;
  padding: 5px 8px; cursor: pointer; font-style: normal; letter-spacing: 0; }
.ncard:hover { background: color-mix(in srgb, var(--hl) 34%, var(--card)); }
.ncard.ask { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 70%, var(--card)); }
.ncard .nc-q { font-weight: 650; color: var(--ink); }
.ncard .nc-t { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 1239px) { .side-notes { width: 100%; } }

.selbar { position: fixed; z-index: 45; display: flex; gap: 2px; padding: 4px; border-radius: 10px; background: var(--ink);
  box-shadow: 0 10px 28px -12px rgba(20, 15, 5, .5); }
.selbar button { font: 600 13px var(--sans); color: var(--card); background: none; border: 0; border-radius: 7px; padding: 6px 11px; cursor: pointer; }
.selbar button:hover { background: color-mix(in srgb, var(--card) 16%, transparent); }

.npop { position: fixed; z-index: 44; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px;
  box-shadow: 0 16px 44px -18px rgba(40, 30, 10, .45); font: 13.5px/1.5 var(--sans); color: var(--ink-2); max-height: 70vh; overflow: auto; }
.npop .np-quote { font-family: var(--serif); font-size: 13.5px; color: var(--muted); border-left: 2px solid var(--hl-ink); padding-left: 8px; margin-bottom: 8px; }
.npop .np-where { font-family: var(--sans); font-weight: 650; color: var(--faint); margin-right: 3px; }
.npop textarea, .npop input { width: 100%; font: 14px/1.5 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 9px; outline: none; resize: vertical; }
.npop textarea:focus, .npop input:focus { border-color: var(--accent); }
.npop .np-q { font-weight: 650; color: var(--ink); margin-bottom: 4px; }
.npop .np-turn + .np-turn { border-top: 1px solid var(--line-2); padding-top: 8px; margin-top: 4px; }
.npop .np-input { margin-top: 6px; }
.ncard .nc-n { font-style: normal; font-weight: 600; font-size: 11px; color: var(--accent); background: var(--card); border-radius: 999px; padding: 0 5px; margin-left: 3px; }
.npop .np-a p { margin: 0 0 7px; } .npop .np-a ul { margin: 0 0 7px; padding-left: 18px; }
.npop .np-a code { font: .9em var(--mono); background: var(--surface); padding: 0 3px; border-radius: 3px; }
.npop .np-wait { color: var(--muted); font-style: italic; }
.npop .np-err { color: var(--r-limitation); font-size: 12.5px; margin-bottom: 6px; }
.npop .np-cites { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 4px; }
.npop .np-cite { font: 600 12px var(--sans); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 2px 9px; cursor: pointer; }
.npop .np-model { font-size: 11.5px; color: var(--faint); }
/* the chat: questions about the whole paper (a button in the corner, a panel above it); its turns look like the
   popover's */
.chatbtn { position: fixed; right: 20px; bottom: 18px; z-index: 41; display: inline-flex; align-items: center; gap: 6px; font: 600 13px var(--sans);
  color: var(--accent); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px 7px 11px; cursor: pointer;
  box-shadow: 0 6px 20px -12px rgba(40, 30, 10, .35); }
.chatbtn svg { width: 16px; height: 16px; }
.chatbtn:hover, .chatbtn.on { border-color: var(--accent); }
.chatbtn.on { background: var(--accent-soft); }
.chat { position: fixed; right: 20px; bottom: 62px; z-index: 45; width: min(420px, calc(100vw - 32px)); max-height: min(72vh, 680px); display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 22px 60px -22px rgba(40, 30, 10, .5); font: 13.5px/1.5 var(--sans); color: var(--ink-2); }
.chat[hidden] { display: none; }
.ch-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 8px 14px; border-bottom: 1px solid var(--line-2); }
.ch-head b { flex: 1; color: var(--ink); font-weight: 650; }
.ch-head button { font: 600 12px var(--sans); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.ch-head .ch-x { border: 0; font-size: 18px; line-height: 1; padding: 2px 7px; }
.ch-head button:hover { color: var(--ink); border-color: var(--ink-2); }
.ch-body { flex: 1 1 auto; min-height: 60px; overflow-y: auto; padding: 10px 14px; }
.ch-hint { color: var(--muted); font-size: 13px; padding: 6px 0; }
.ch-foot { padding: 8px 10px 10px; border-top: 1px solid var(--line-2); }
.ch-input { width: 100%; font: 14px/1.5 var(--sans); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 9px;
  padding: 7px 10px; outline: none; resize: none; }
.ch-input:focus { border-color: var(--accent); }
.chat .np-q { font-weight: 650; color: var(--ink); margin-bottom: 4px; }
.chat .np-turn + .np-turn { border-top: 1px solid var(--line-2); padding-top: 8px; margin-top: 6px; }
.chat .np-a p { margin: 0 0 7px; } .chat .np-a ul, .chat .np-a ol { margin: 0 0 7px; padding-left: 18px; }
.chat .np-a code { font: .9em var(--mono); background: var(--surface); padding: 0 3px; border-radius: 3px; }
.chat .np-wait { color: var(--muted); font-style: italic; }
.chat .np-err { color: var(--r-limitation); font-size: 12.5px; }
.chat .np-cites { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 4px; }
.chat .np-cite { font: 600 12px var(--sans); color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 2px 9px; cursor: pointer; }
/* citations inside an answer, where the model put them: a chip that leads to the paragraph (its point under the pointer),
   the model's own inference, a citation that named no paragraph */
.np-a .np-cite.in, .np-a .np-cite.bad, .np-a .np-inf { display: inline-flex; align-items: center; height: 18px; margin: 0 1px 0 2px; padding: 0 6px;
  vertical-align: 1px; border-radius: 999px; font: 600 11px/1 var(--sans); white-space: nowrap; }
.np-a .np-cite.in { color: var(--accent); background: var(--accent-soft); border: 1px solid transparent; cursor: pointer; }
.np-a .np-cite.in:hover { border-color: var(--accent); }
.np-a .np-cite.bad { color: var(--r-limitation); background: color-mix(in srgb, var(--r-limitation) 10%, transparent); cursor: help; }
.np-a .np-inf { font-weight: 500; font-style: italic; color: var(--muted); border: 1px dashed var(--line); cursor: help; }
/* the paragraph a citation under the pointer leads to: it beats, as an argument link's ends do */
.u.cite-lit { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); border-radius: 6px; transition: background-color .15s; }
.u.cite-lit > .dot { --beat: var(--accent); opacity: 1 !important; animation: dr-beat 1.6s ease-out infinite; }
/* questions to start from (an empty conversation) and to go on with (under the last answer) */

      `# ${m.title}`, '', [(m.authors || []).map(flipName).join(', '), m.abs_url ? `[${sourceName(m)}](${m.abs_url})` : sourceName(m)].filter(Boolean).join(' · '), ''];

  const PDF_OK = !!D.app && /^(\d{4}\.\d{4,5}|pmc\d+|ppr\d+|(biorxiv|medrxiv)-[0-9.]+)$/.test(D.meta.id);

  async function openCompare() {

  // the pages: sized at once (the pane scrolls through all of them), drawn when they come near
  async function layPages() {

  // every word on the pages, in reading order, with its boxes (scale 1): a word broken by a hyphen at a line's end is
  // one word, and so is a word the PDF wrote in two pieces
  async function indexWords() {
    const words = [];
    for (const p of cmp.pages) {
      const tc = await p.page.getTextContent();
      let lastY = null, lastEnd = null;
      for (const it of tc.items) {
        if (!it.str || !it.str.trim()) { lastEnd = null; continue; }
        const tx = cmp.lib.Util.transform(p.vp.transform, it.transform);
        const fh = Math.hypot(tx[2], tx[3]) || it.height || 8, x = tx[4], base = tx[5], s = it.str, L = s.length;
        const newLine = lastY === null || Math.abs(base - lastY) > fh * 0.5;
        lastY = base;
        const re = /\S+/g;
        let m, first = true;
        while ((m = re.exec(s))) {
          const x0 = x + it.width * (m.index / L), x1 = x + it.width * ((m.index + m[0].length) / L);
          const box = { x: x0, y: base - fh * 0.82, w: x1 - x0, h: fh * 1.08 };
          const w = pdfNorm(m[0]), prev = words[words.length - 1];
          const glued = first && m.index === 0 && !newLine && lastEnd !== null && x0 - lastEnd < fh * 0.12;   // two pieces of one word
          const broken = first && newLine && prev && prev.hyph && prev.page === p.n;                          // net- / work
          first = false;
          if (!w) continue;
          if ((glued || broken) && prev) { prev.w += w; prev.boxes.push(box); prev.hyph = /[-‐]$/.test(m[0]); continue; }
          words.push({ w, page: p.n, boxes: [box], hyph: /[-‐]$/.test(m[0]) });
        }
        lastEnd = /\s$/.test(s) ? null : x + it.width;
      }
    }
    const grams = new Map();
    for (let i = 0; i + 2 < words.length; i++) {
      const k = `${words[i].w} ${words[i + 1].w} ${words[i + 2].w}`;
      const a = grams.get(k);
      if (a) a.push(i); else grams.set(k, [i]);
    }
    Object.assign(cmp, { words, grams });
  }

  // where a paragraph is: its runs of three words found on the pages, the run of agreeing places they vote for, and
  // the words from its first match to its last (formula symbols on the page sit between them, so a place may drift)
  function locate(uid) {
    if (cmp.spans.has(uid)) return cmp.spans.get(uid);
    const u = U[uid], uw = u ? u.toks.filter((t) => t.t).map((t) => pdfNorm(t.t)).filter(Boolean) : [];
    const hitsOf = (i) => { const a = cmp.grams.get(`${uw[i]} ${uw[i + 1]} ${uw[i + 2]}`); return a && a.length <= 30 ? a : null; };
    let span = null;
    if (uw.length >= 3) {
      const votes = new Map();
      for (let i = 0; i + 2 < uw.length; i++) for (const j of hitsOf(i) || []) { const k = Math.round((j - i) / 8); votes.set(k, (votes.get(k) || 0) + 1); }
      let k0 = null, n0 = 0;
      for (const [k, n] of votes) { const all = n + (votes.get(k - 1) || 0) + (votes.get(k + 1) || 0); if (all > n0) { n0 = all; k0 = k; } }
      if (k0 !== null && n0 >= Math.max(2, Math.min(5, Math.floor((uw.length - 2) * 0.25)))) {
        let lo = -1, hi = -1, lastI = 0;
        for (let i = 0; i + 2 < uw.length; i++) {
          for (const j of hitsOf(i) || []) {
            const ok = lo < 0 ? Math.abs(Math.round((j - i) / 8) - k0) <= 1 : j > hi - 2 && j - hi <= (i - lastI) + 40;
            if (ok) { if (lo < 0) lo = j; hi = j + 2; lastI = i; break; }
          }
        }
        if (lo >= 0) span = { lo, hi, page: cmp.words[lo].page, boxes: boxesOf(lo, hi) };
      }
    }
    cmp.spans.set(uid, span);
    return span;
  }
  function boxesOf(lo, hi) {   // the words' boxes, one per line
    const lines = [];
    for (let i = lo; i <= hi; i++) {
      const w = cmp.words[i];
      for (const b of w.boxes) {
        const line = lines.find((l) => l.page === w.page && Math.abs(l.y + l.h / 2 - (b.y + b.h / 2)) < b.h * 0.45 && b.x < l.x + l.w + b.h * 3 && b.x + b.w > l.x - b.h * 3);
        if (line) {
          const x1 = Math.max(line.x + line.w, b.x + b.w), y1 = Math.max(line.y + line.h, b.y + b.h);
          line.x = Math.min(line.x, b.x); line.y = Math.min(line.y, b.y); line.w = x1 - line.x; line.h = y1 - line.y;
        } else lines.push({ page: w.page, x: b.x, y: b.y, w: b.w, h: b.h });
      }
    }
    return lines;
  }

  // a paragraph shown on its page: the pane scrolls to it when it is out of sight (or always, when picked)
  function showSpan(span, how) {
    const before = cmp.current;
    cmp.current = span;
    cmp.picked = how === 'pick';
    for (const p of cmp.pages) if ((before && before.boxes.some((b) => b.page === p.n)) || span.boxes.some((b) => b.page === p.n)) paintMarks(p);
    if (how === 'stay') return;
    const b = span.boxes[0], p = cmp.pages[b.page - 1], sc = cmp.scroller;
    const y = p.el.offsetTop + b.y * cmp.scale, last = span.boxes[span.boxes.length - 1];
    const yEnd = cmp.pages[last.page - 1].el.offsetTop + (last.y + last.h) * cmp.scale;
    const seen = y >= sc.scrollTop + 40 && yEnd <= sc.scrollTop + sc.clientHeight - 20;
    if (how === 'pick' || !seen) sc.scrollTo({ top: y - sc.clientHeight * 0.28, behavior: how === 'pick' && !reduced ? 'smooth' : 'auto' });
  }

      const m = h('div', `pp-mark${cmp.picked ? ' pick' : ''}`);
      m.style.cssText = `left:${(b.x - 2) * s}px;top:${(b.y - 1) * s}px;width:${(b.w + 4) * s}px;height:${(b.h + 2) * s}px`;
      return m;
    }));
  }

  // reading on: the paragraph at the reading line, shown on its page
  function followNow() {
    if (!cmp || !cmp.grams) return;
    const u = unitAtReading();
    if (!u || u.dataset.u === cmp.follow) return;
    cmp.follow = u.dataset.u;
    const span = locate(u.dataset.u);
    if (span) showSpan(span, 'follow');
  }
  let followTimer = null;
  addEventListener('scroll', () => { if (cmp) { clearTimeout(followTimer); followTimer = setTimeout(followNow, 140); } }, { passive: true });
  addEventListener('resize', () => {
    if (!cmp || !cmp.pages.length) return;
    clearTimeout(cmp.resizeTimer);
    cmp.resizeTimer = setTimeout(() => {
      if (!cmp) return;
      sizePages();
      const sc = cmp.scroller;
      for (const p of cmp.pages) if (p.el.offsetTop < sc.scrollTop + sc.clientHeight + 800 && p.el.offsetTop + p.el.offsetHeight > sc.scrollTop - 800) drawPage(p);
    }, 150);
  });
  // a paragraph clicked: its place on the page
  docEl.addEventListener('click', (e) => {
    if (!cmp || !cmp.grams) return;
    const fig = e.target.closest('figure.fig'), u = e.target.closest('.u[data-u]') || (fig && fig.querySelector('figcaption.u'));
    if (!u) return;
    const span = locate(u.dataset.u);
    cmp.follow = u.dataset.u;
    if (span) showSpan(span, 'pick');
  });
  // a page clicked: the paragraph there (the narrowest that holds the word under the pointer)
  function onPageClick(e) {
    const el = e.target.closest('.pp-page');
    if (!el || !cmp.grams) return;
    const n = +el.dataset.n, r = el.getBoundingClientRect(), px = (e.clientX - r.left) / cmp.scale, py = (e.clientY - r.top) / cmp.scale;
    let at = -1, best = Infinity;
    cmp.words.forEach((w, i) => {
      if (w.page !== n) return;
      for (const b of w.boxes) {
        const dx = Math.max(b.x - px, 0, px - b.x - b.w), dy = Math.max(b.y - py, 0, py - b.y - b.h), d = dx * dx + 4 * dy * dy;
        if (d < best) { best = d; at = i; }
      }
    });
    if (at < 0 || best > 900) return;
    let hit = null;
    for (const uid of order.keys()) {
      const s = locate(uid);
      if (s && s.lo <= at && at <= s.hi && (!hit || s.hi - s.lo < hit.s.hi - hit.s.lo)) hit = { uid, s };
    }
    if (!hit) return;
    cmp.follow = hit.uid;
    showSpan(hit.s, 'stay');
    const target = unitEl.get(hit.uid);
    if (target) go(target.closest('figure.fig') || target, null);
  }

  // ── the legend, both ways: hovering a kind lights its paragraphs' dots (and on the map, its chips) while the rest
  //    step back; hovering a paragraph lights its kind. A click on a kind keeps it lit until clicked again (or Esc).
  let rolePinned = null;
  const legendEl = document.getElementById('legend');
  function legendFocus(role, pin = false) {
    if (pin) rolePinned = role;
    const r = role || rolePinned;
    if (r) docEl.dataset.role = r; else delete docEl.dataset.role;
    legendEl.querySelectorAll('[data-role]').forEach((it) => it.classList.toggle('pin', it.dataset.role === rolePinned));
  }
  function legendMark(role) { legendEl.querySelectorAll('[data-role]').forEach((it) => it.classList.toggle('on', it.dataset.role === role)); }
  legendEl.addEventListener('mouseover', (e) => { const it = e.target.closest('[data-role]'); if (it) legendFocus(it.dataset.role); });
  legendEl.addEventListener('mouseleave', () => legendFocus(null));
  legendEl.addEventListener('click', (e) => {
    const it = e.target.closest('[data-role]');
    if (it) legendFocus(rolePinned === it.dataset.role ? null : it.dataset.role, true);
  });

  // ── chrome: the bar, the legend, the language ───────────────────────
  // The bar is a slider, in the manner of a segmented control: a raised thumb sits under the level, follows the
  // zoom position continuously, and follows the finger while dragged (dragging scrubs the zoom itself). On
  // release it springs to the nearer level. A click jumps.
  const bar = document.getElementById('zoombar');
  const thumb = h('span', 'zthumb');
  bar.append(thumb);
  BAR.forEach((L, i) => {
    if (i) bar.append(Object.assign(h('span', 'sep'), { textContent: '›' }));
    const b = h('button'); b.type = 'button'; b.dataset.l = L;
    b.title = `${i + 1}`;
    b.addEventListener('click', (e) => { if (e.detail === 0) setLevel(L); });   // the keyboard's Enter (pointer clicks: see pointerup)
    bar.append(b);
  });
  const barButtons = () => [...bar.querySelectorAll('button')];
  let geom = null;   // centres and sizes of the labels, measured once per layout
  function measureBar() {
    const bars = bar.getBoundingClientRect();
    geom = barButtons().map((b) => { const r = b.getBoundingClientRect(); return { l: +b.dataset.l, left: r.left - bars.left, width: r.width, centre: r.left + r.width / 2 }; });
  }
  function placeThumb() {
    if (!geom) measureBar();
    const i = 4 - pos, lo = Math.max(0, Math.min(4, Math.floor(i))), hi = Math.min(4, lo + 1), f = i - lo;
    const a = geom[lo], b = geom[hi];
    if (!a || !b) return;
    const x = a.left + (b.left - a.left) * f, w = a.width + (b.width - a.width) * f;
    thumb.style.transform = `translateX(${x}px)`;
    thumb.style.width = `${w}px`;
    const on = Math.round(pos);
    barButtons().forEach((btn) => btn.classList.toggle('on', +btn.dataset.l === on));
  }
  function posAt(x) {   // the zoom position under a point of the bar
    if (!geom) measureBar();
    const c = geom.map((g) => g.centre);
    if (x <= c[0]) return 4;
    if (x >= c[4]) return 0;
    const i = c.findIndex((v, k) => x >= v && x <= c[k + 1]);
    return 4 - i - (x - c[i]) / (c[i + 1] - c[i]);
  }
  let drag = null;
  bar.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || (busy && !tr && !stage)) return;
    bar.setPointerCapture(e.pointerId);
    bar.classList.add('dragging');
    measureBar();
    drag = { x0: e.clientX, moved: false };
    clearTimeout(snapTimer);
  });
  bar.addEventListener('pointermove', (e) => {
    if (!drag) return;
    if (!drag.moved && Math.abs(e.clientX - drag.x0) > 3) { drag.moved = true; holding = true; aimLevel = null; gesturePoint = null; }
    if (drag.moved) { goal = posAt(e.clientX); kick(); }
  });
  const endDrag = (e) => {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    bar.classList.remove('dragging');
    if (moved) release(); else setLevel(Math.round(posAt(e.clientX)));   // a click on a label
  };
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', endDrag);
  bar.setAttribute('role', 'slider');
  bar.setAttribute('aria-valuemin', '0');
  bar.setAttribute('aria-valuemax', '4');
  function updateBar() {
    barButtons().forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.l === level)));
    bar.setAttribute('aria-valuenow', String(level));
    bar.setAttribute('aria-valuetext', T[ui].levels[level]);
    placeThumb();
  }
  const legend = document.getElementById('legend');
  const tagline = document.querySelector('.tagline');
  const usedRoles = new Set(Object.values(U).map((u) => u.lad.role));
  // the language menu: generated languages switch in place; in the app, the others can be generated, and the
  // current one regenerated (a new sample from the model replaces the stored version)
  const langBtn = document.getElementById('langbtn');
  const langMenu = document.getElementById('langmenu');
  function renderLangMenu() {
    const t = T[ui];
    langMenu.replaceChildren();
    for (const code of I18N.CODES) {
      const have = AVAIL.includes(code);
      if (!have && !D.app) continue;
      const b = h('button', `lm-item${code === lang ? ' on' : ''}${have ? '' : ' gen'}`);
      b.type = 'button';
      b.innerHTML = `<span>${esc(I18N.NATIVE[code])}</span>${!have ? `<em>+ ${esc(t.gen_lang)}</em>` : STALE.has(code) ? `<em class="stale">${esc(t.stale)}</em>` : ''}`;
      b.addEventListener('click', () => { closeLangMenu(); if (have) setLang(code); else window.DRApp.generate(code, false); });
      langMenu.append(b);
    }
    if (D.app) {
      const r = h('button', 'lm-item lm-regen'); r.type = 'button';
      r.innerHTML = `<span>↻ ${esc(t.regen)}</span><em>${esc(I18N.NATIVE[lang])}</em>`;
      r.addEventListener('click', () => { closeLangMenu(); window.DRApp.generate(lang, true); });
      langMenu.append(r);
    }
  }
  function closeLangMenu() { langMenu.hidden = true; langBtn.setAttribute('aria-expanded', 'false'); }
  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!langMenu.hidden) return closeLangMenu();
    renderLangMenu(); langMenu.hidden = false; langBtn.setAttribute('aria-expanded', 'true');
  });
  addEventListener('click', (e) => { if (!langMenu.hidden && !e.target.closest('.langpick')) closeLangMenu(); });
  if (!D.app && AVAIL.length < 2) document.querySelector('.langpick').remove();

  // ── a figure, enlarged: a click on its picture opens it over the page with its caption (as the reader sees it now:
  //    this language, this level); Esc, a click beside it or × closes it. A picture larger than the screen opens to
  //    fit, and a click on it shows it at full size, to scroll ──
  const lightbox = h('div', 'lightbox');
  lightbox.hidden = true;
  lightbox.setAttribute('role', 'dialog');
  lightbox.setAttribute('aria-modal', 'true');
  document.body.append(lightbox);
  let lightboxFrom = null;
  function openLightbox(pic) {
    const fig = pic.closest('figure.fig'), cap = fig && fig.querySelector('figcaption');
    const shown = pic.cloneNode(true);
    shown.removeAttribute('style');
    shown.classList.add('lb-pic');
    if (shown.tagName.toLowerCase() === 'svg') { shown.removeAttribute('width'); shown.removeAttribute('height'); }
    const stage = h('div', 'lb-stage');
    stage.append(shown);
    const x = h('button', 'lb-x', '×');
    x.type = 'button';
    x.setAttribute('aria-label', T[ui].close);
    lightbox.replaceChildren(stage, x);
    if (cap) {
      const label = cap.querySelector('.flabel'), text = cap._tx ? cap._tx.innerText.trim() : '';
      const c = h('div', 'lb-cap');
      c.textContent = [label && label.textContent.trim(), text].filter(Boolean).join(' ');
      if (c.textContent) lightbox.append(c);
      lightbox.setAttribute('aria-label', c.textContent || 'Figure');
    }
    lightbox.classList.remove('lb-full');
    lightbox.hidden = false;
    document.documentElement.classList.add('lb-open');
    lightboxFrom = document.activeElement;
    x.focus({ preventScroll: true });
  }
  function closeLightbox() {
    lightbox.hidden = true;
    lightbox.replaceChildren();
    document.documentElement.classList.remove('lb-open');
    if (lightboxFrom && lightboxFrom.focus) lightboxFrom.focus({ preventScroll: true });
  }
  lightbox.addEventListener('click', (e) => {
    const pic = e.target.closest('.lb-pic');
    if (pic && pic.tagName.toLowerCase() === 'img') {   // larger than the screen: full size, to scroll; and back
      const fits = pic.naturalWidth <= pic.clientWidth + 2 && pic.naturalHeight <= pic.clientHeight + 2;
      if (!fits || lightbox.classList.contains('lb-full')) { lightbox.classList.toggle('lb-full'); return; }
    }
    if (!pic) closeLightbox();
  });

  // ── input ────────────────────────────────────────────────────────────
  // ⌘/Ctrl + wheel and a trackpad pinch zoom around the pointer; over the slider, the plain wheel zooms
  addEventListener('wheel', (e) => {
    const overBar = !!(e.target.closest && e.target.closest('#zoombar'));
    if (!e.ctrlKey && !e.metaKey && !overBar) { snapNow(); return; }
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
    const d = (Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX) * unit;
    zoomBy(-d / 240, overBar ? null : { x: e.clientX, y: e.clientY });
  }, { passive: false });
  let g0 = 0;     // Safari's pinch
  addEventListener('gesturestart', (e) => { e.preventDefault(); g0 = goal; if (!tr && !stage) gesturePoint = { x: e.clientX, y: e.clientY }; holding = true; });
  addEventListener('gesturechange', (e) => {
    e.preventDefault();
    if (busy && !tr && !stage) return;
    goal = Math.max(0, Math.min(4, g0 + Math.log(e.scale) * 2.4));
    kick();
  });
  addEventListener('gestureend', (e) => { e.preventDefault(); release(); });
  addEventListener('keydown', (e) => {
    if (!lightbox.hidden) {   // an enlarged figure takes the keys: Esc closes it, the rest do nothing behind it
      if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
      return;
    }
    if (e.target.closest && e.target.closest('input, textarea, [contenteditable]')) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape' && (popNote || !selbar.hidden)) { closeNote(); hideSelbar(); e.preventDefault(); return; }
    if (e.key === 'Escape' && rolePinned) { legendFocus(null, true); e.preventDefault(); return; }
    if (e.key === '-' || e.key === '_') setLevel(level - 1);
    else if (e.key === '=' || e.key === '+') setLevel(level + 1);
    else if (/^[1-5]$/.test(e.key)) setLevel(BAR[+e.key - 1]);
    else if (e.key === 'l' && AVAIL.length > 1) setLang(AVAIL[(AVAIL.indexOf(lang) + 1) % AVAIL.length]);
    else if (e.key === 'Escape' && !langMenu.hidden) closeLangMenu();
    else if (e.key === 'Escape' && localLevel.size) setLevel(level);
    else return;
    e.preventDefault();
  });
  docEl.addEventListener('click', (e) => {
    const pic = e.target.closest('figure.fig .fbody img, figure.fig .fbody svg');
    if (pic && !String(getSelection()).length) { e.preventDefault(); openLightbox(pic.closest('svg') || pic); return; }
    const card = e.target.closest('.ncard');
    if (card) { e.preventDefault(); const n = notes.find((x) => x.id === card.dataset.note); if (n) openNote(n); return; }
    const mark = e.target.closest('.hl, .hlsp');
    if (mark && !String(getSelection()).length) { const n = noteAt(mark); if (n) { e.preventDefault(); openNote(n); return; } }
    const lk = e.target.closest('.lk');
    if (lk) { e.preventDefault(); hidePeek(); go(edgeTarget(lk.dataset.tk, lk.dataset.to), lk.closest('.u')); return; }
    const a = e.target.closest('a[href^="#"]');
    if (a) {
      const id = decodeURIComponent(a.getAttribute('href').slice(1));
      e.preventDefault();
      if (id.startsWith('bib')) { showPeek(a); return; }       // a citation: show the reference, stay here
      hidePeek();
      go(resolve(id), a.closest('.u'));
      return;
    }
    if (e.target.closest('a, details, summary')) return;
    if (level === 4 && !localLevel.size) return;
    if (String(getSelection()).length) return;
    const el = e.target.closest('.u');
    if (!el || !el.dataset.u) return;
    if (level === 0 && !localLevel.size) {
      const r = el.getBoundingClientRect();
      setLevel(2, { el, y: r.top, frac: 0 });
    } else toggleUnit(el.dataset.u);
  });

  let relayoutTimer = null;
  function relayout() {
    clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(() => { const t0 = performance.now(); layoutSides(); perf('sides', t0); }, 30);
  }
  addEventListener('resize', () => { snapNow(); capEpoch++; relayout(); geom = null; placeThumb(); warmSoon(); });

  // ── start ────────────────────────────────────────────────────────────
  build();
  for (const [c, hd, st] of headEls) secs.set(c.id, { c, sec: hd.parentNode, hd, st });
  IDS = [...order.keys()];
  {   // a heading's place in reading order: the first unit after it
    let pend = [];
    for (const el of docEl.querySelectorAll('.hd, .u')) {
      if (el.classList.contains('hd')) pend.push(el);
      else { for (const hd of pend) HEAD_IDX.set(hd, order.get(el.dataset.u)); pend = []; }
    }
    for (const hd of pend) HEAD_IDX.set(hd, IDS.length - 1);
  }
  // ?lang= (the app), #lang= (a static file), then the last choice, then the browser's languages
  const asked = new URLSearchParams(location.search).get('lang') || (/[#&]lang=([\w-]+)/.exec(location.hash) || [])[1];
  lang = [asked, store.get('dr-lang'), I18N.guess(), 'en', AVAIL[0]].find((l) => l && AVAIL.includes(l));
  const start = /[#&]level=([^&]+)/.exec(location.hash);
  if (start) {
    const want = decodeURIComponent(start[1]).toLowerCase();
    const L = I18N.CODES.map((c) => T[c].levels.findIndex((n) => n.toLowerCase() === want)).find((i) => i >= 0);
    if (L !== undefined) level = L;
  }
  docEl.dataset.level = level;
  document.documentElement.dataset.level = level;
  pos = goal = level;
  applyLang();
  renderAll();
  updateBar();
  relayout();
  if (document.fonts) {
    document.fonts.ready.then(() => { capEpoch++; relayout(); geom = null; placeThumb(); warmSoon(30); });   // the keyframes, as soon as the type is in
    document.fonts.addEventListener('loadingdone', () => { capEpoch++; warmSoon(); });
  }
  docEl.addEventListener('load', () => { capEpoch++; warmSoon(); }, true);   // an image arrived: the layout moved
  addEventListener('load', () => { relayout(); warmSoon(); });
  if (window.__drPerf) window.__drPerf.push(['boot', Math.round(performance.now())]);
  hydrateSoon();
  warmSoon(600);
  loadNotes();
  try { if (PDF_OK && innerWidth >= 1100 && localStorage.getItem(CMP_KEY) === '1') openCompare(); } catch { /* private window */ }
  // the page again after a generation (app.js): the level and the paragraph that were being read, where they were
  try {
    const k = JSON.parse(sessionStorage.getItem('pf-keep') || 'null');
    sessionStorage.removeItem('pf-keep');
    const el = k && k.pid === D.meta.id && unitEl.get(k.uid);
    if (el) {
      const back = () => requestAnimationFrame(() => scrollBy(0, el.getBoundingClientRect().top - k.top));
      if (typeof k.level === 'number' && k.level !== level) { setLevel(k.level); setTimeout(back, DUR + 120); } else back();
    }
  } catch { /* private window */ }
  function setUi(code) {
    if (!T[code] || code === ui) return;
    ui = code;
    try { localStorage.setItem(UI_KEY, code); } catch { /* private window */ }
    applyLang();
  }
  window.__reader = { setLevel, setLang, setUi, get ui() { return ui; }, zoomBy,
    get compared() { if (!cmp || !cmp.grams) return null; const ids = [...order.keys()]; return { units: ids.length, found: ids.filter((id) => locate(id)).length, words: cmp.words.length }; }, get level() { return level; }, get lang() { return lang; }, get pos() { return pos; },
    get staged() { return !!stage; }, get _caps() { return caps; }, get keyframes() { return caps.map((c) => (c ? c.P.size : 0)); },
    // holding the zoom at a position, as a hand would (for looking at the motion frame by frame)
    scrubTo(p) { clearTimeout(snapTimer); holding = true; aimLevel = null; goal = Math.max(0, Math.min(4, p)); kick(); }, letGo() { release(); } };
})();
</script>
</body>
